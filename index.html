<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="임태형">
  <meta name="description" content="전주교육대학교 교육방법 및 교육공학 텍스트 교재와 강의 자료">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="교육방법 및 교육공학">
  <meta property="og:description" content="수업을 설계하고, 기술을 판단하는 법.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://taehyeonglim.github.io/edtech/">
  <meta property="og:image" content="https://taehyeonglim.github.io/edtech/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="교육방법 및 교육공학 — 수업을 설계하고, 기술을 판단하는 법.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="교육방법 및 교육공학">
  <meta name="twitter:description" content="수업을 설계하고, 기술을 판단하는 법.">
  <meta name="twitter:image" content="https://taehyeonglim.github.io/edtech/assets/og.png">
  <title>교육방법 및 교육공학 · 임태형</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f6f8;
      --label: #1d1d1f;
      --label-secondary: #57575d;
      --label-tertiary: #66666d;
      --separator: rgba(0, 0, 0, .10);
      --fill-hover: rgba(0, 0, 0, .04);
      --accent: #0b2c5c;
      --accent-emphasis: #1b66c9;
      --accent-fill: rgba(11, 44, 92, .07);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      --safe-x: clamp(24px, 5.2vw, 80px);
      --r-sm: 8px;
      --r-lg: 18px;
      --r-pill: 980px;
      --ease: cubic-bezier(.28, .11, .32, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--label);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.6;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent-emphasis);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      border: 1px solid var(--separator);
      border-radius: var(--r-sm);
      background: var(--bg);
      color: var(--accent);
      font-weight: 700;
      transform: translateY(-180%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .shell {
      width: min(1280px, calc(100% - clamp(48px, 10.4vw, 160px)));
      margin-inline: auto;
    }

    .site-header {
      border-bottom: 1px solid var(--separator);
    }

    .header-inner {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 14px;
    }

    .university {
      color: var(--label);
      font-weight: 700;
    }

    .course-name {
      color: var(--label-tertiary);
    }

    .landing {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(420px, .95fr);
      gap: clamp(56px, 9vw, 140px);
      align-items: center;
      min-height: calc(100svh - 72px);
      padding-block: clamp(64px, 9vh, 108px);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(48px, 5.4vw, 78px);
      font-weight: 760;
      letter-spacing: -.045em;
      line-height: 1.06;
      text-wrap: balance;
    }

    .lead {
      max-width: 540px;
      margin: 27px 0 0;
      color: var(--label-secondary);
      font-size: clamp(17px, 1.4vw, 20px);
      text-wrap: pretty;
    }

    .routes {
      overflow: hidden;
      border: 1px solid var(--separator);
      border-radius: var(--r-lg);
      background: var(--bg);
    }

    .route {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 28px;
      min-height: 224px;
      padding: clamp(28px, 3.5vw, 44px);
      transition: background .18s var(--ease);
    }

    .route + .route {
      border-top: 1px solid var(--separator);
    }

    .route:hover {
      background: var(--accent-fill);
    }

    .route-label {
      display: block;
      margin-bottom: 25px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 730;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .route h2 {
      margin: 0;
      font-size: clamp(27px, 2.7vw, 39px);
      font-weight: 730;
      letter-spacing: -.035em;
      line-height: 1.15;
    }

    .route p {
      margin: 9px 0 0;
      color: var(--label-secondary);
      font-size: 14px;
    }

    .route-arrow {
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border-radius: var(--r-pill);
      background: var(--bg-secondary);
      color: var(--accent);
      font-size: 21px;
      transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
    }

    .route:hover .route-arrow {
      background: var(--accent);
      color: #ffffff;
      transform: translateX(3px);
    }

    @media (max-width: 900px) {
      .landing {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero-copy {
        max-width: 760px;
      }

      .routes {
        width: min(100%, 760px);
      }
    }

    @media (max-width: 560px) {
      .header-inner {
        min-height: 64px;
      }

      .course-name {
        font-size: 0;
      }

      .course-name::after {
        font-size: 13px;
        content: "임태형";
      }

      .landing {
        gap: 48px;
        padding-block: 58px 72px;
      }

      h1 {
        font-size: clamp(42px, 12vw, 58px);
      }

      .lead {
        font-size: 17px;
      }

      .route {
        min-height: 188px;
        padding: 27px 24px;
      }

      .route-label {
        margin-bottom: 20px;
      }

      .route-arrow {
        width: 40px;
        height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="shell header-inner">
      <span class="university">전주교육대학교</span>
      <span class="course-name">임태형 · 교육방법 및 교육공학</span>
    </div>
  </header>

  <main id="main-content" class="shell landing">
    <div class="hero-copy">
      <p class="eyebrow">교육방법 및 교육공학</p>
      <h1>수업을 설계하고,<br>기술을 판단하는 법.</h1>
      <p class="lead">먼저 교재를 읽고, 강의 자료로 확인하세요.</p>
    </div>

    <nav class="routes" aria-label="학습 자료 선택">
      <a class="route" href="./book/">
        <span>
          <span class="route-label">먼저 읽기</span>
          <h2>텍스트 교재</h2>
          <p>4부 11장 · 정본</p>
        </span>
        <span class="route-arrow" aria-hidden="true">→</span>
      </a>

      <a class="route" href="./chapters/">
        <span>
          <span class="route-label">수업에서 보기</span>
          <h2>강의 자료</h2>
          <p>10강 · 보조 자료</p>
        </span>
        <span class="route-arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
