<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">참여 저하를 진단하는 흐름</title>
  <desc id="desc">참여 저하를 의미, 성공 가능성, 지속, 난이도 조건으로 나누고 각각의 수업 조정으로 연결하는 도식</desc>
  <style>
    .bg{fill:#fff}.title{fill:#0B2C5C;font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#315276;font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.start{fill:#0B2C5C}.st{fill:#fff;font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{fill:#F5F9FF;stroke:#1B66C9;stroke-width:2}.ct{fill:#0B2C5C;font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.cs{fill:#315276;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.line{stroke:#72A6E8;stroke-width:3;fill:none}.out{fill:#1B66C9}.ot{fill:#fff;font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
  <rect class="bg" width="960" height="500" rx="18"/>
  <text class="title" x="480" y="50" text-anchor="middle">참여 저하를 한 가지 성향으로 단정하지 않기</text>
  <text class="sub" x="480" y="78" text-anchor="middle">관찰한 증상을 수업 조건으로 나누고, 가장 작은 조정부터 시도한다.</text>
  <rect class="start" x="350" y="112" width="260" height="64" rx="20"/><text class="st" x="480" y="153" text-anchor="middle">참여가 낮다</text>
  <path class="line" d="M480 176 V212 H170 V238 M480 212 H390 V238 M480 212 H610 V238 M480 212 H830 V238"/>
  <g><rect class="card" x="45" y="238" width="250" height="105" rx="16"/><text class="ct" x="170" y="275" text-anchor="middle">의미를 못 찾는가?</text><text class="cs" x="170" y="306" text-anchor="middle">관련성: 목표·경험 연결</text><rect class="out" x="45" y="385" width="250" height="54" rx="15"/><text class="ot" x="170" y="419" text-anchor="middle">자료·선택권 조정</text></g>
  <g><rect class="card" x="265" y="238" width="250" height="105" rx="16"/><text class="ct" x="390" y="275" text-anchor="middle">성공을 낮게 보는가?</text><text class="cs" x="390" y="306" text-anchor="middle">자신감: 기준·예시·연습</text><rect class="out" x="265" y="385" width="250" height="54" rx="15"/><text class="ot" x="390" y="419" text-anchor="middle">과제·피드백 조정</text></g>
  <g><rect class="card" x="485" y="238" width="250" height="105" rx="16"/><text class="ct" x="610" y="275" text-anchor="middle">시작 뒤 멈추는가?</text><text class="cs" x="610" y="306" text-anchor="middle">의지: 일정·중간 점검</text><rect class="out" x="485" y="385" width="250" height="54" rx="15"/><text class="ot" x="610" y="419" text-anchor="middle">지속 장치 조정</text></g>
  <g><rect class="card" x="705" y="238" width="250" height="105" rx="16"/><text class="ct" x="830" y="275" text-anchor="middle">너무 쉽거나 어려운가?</text><text class="cs" x="830" y="306" text-anchor="middle">도전-기술 균형</text><rect class="out" x="705" y="385" width="250" height="54" rx="15"/><text class="ot" x="830" y="419" text-anchor="middle">난이도·간격 조정</text></g>
  <path class="line" d="M170 343 V385 M390 343 V385 M610 343 V385 M830 343 V385"/>
</svg>
