<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">ARCS-V 수업 설계 지도</title>
  <desc id="desc">주의집중, 관련성, 자신감, 만족감의 네 범주를 학습 지속을 돕는 의지 지원이 가로지르는 도식</desc>
  <style>
    .bg{fill:#fff}.title{fill:#0B2C5C;font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#315276;font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.circle{fill:#F5F9FF;stroke:#1B66C9;stroke-width:3}.letter{fill:#1B66C9;font:800 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#0B2C5C;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#315276;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.band{fill:#0B2C5C}.bandT{fill:#fff;font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bandS{fill:#DCEBFF;font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.arrow{stroke:#72A6E8;stroke-width:4}
  </style>
  <rect class="bg" width="960" height="450" rx="18"/>
  <text class="title" x="480" y="52" text-anchor="middle">ARCS-V: 참여 조건을 수업 장치로 번역하기</text>
  <text class="sub" x="480" y="80" text-anchor="middle">참여가 낮을 때 모든 전략을 더하지 말고, 가장 약한 조건부터 진단한다.</text>
  <line class="arrow" x1="190" y1="185" x2="770" y2="185"/>
  <polygon fill="#72A6E8" points="780,185 760,175 760,195"/>
  <g transform="translate(180 185)"><circle class="circle" r="70"/><text class="letter" y="-4" text-anchor="middle">A</text><text class="label" y="34" text-anchor="middle">주의집중</text><text class="copy" y="104" text-anchor="middle">핵심 질문을 보게 한다</text></g>
  <g transform="translate(380 185)"><circle class="circle" r="70"/><text class="letter" y="-4" text-anchor="middle">R</text><text class="label" y="34" text-anchor="middle">관련성</text><text class="copy" y="104" text-anchor="middle">왜 배우는지 연결한다</text></g>
  <g transform="translate(580 185)"><circle class="circle" r="70"/><text class="letter" y="-4" text-anchor="middle">C</text><text class="label" y="34" text-anchor="middle">자신감</text><text class="copy" y="104" text-anchor="middle">성공 경로를 보인다</text></g>
  <g transform="translate(780 185)"><circle class="circle" r="70"/><text class="letter" y="-4" text-anchor="middle">S</text><text class="label" y="34" text-anchor="middle">만족감</text><text class="copy" y="104" text-anchor="middle">의미와 공정성을 확인한다</text></g>
  <rect class="band" x="130" y="330" width="700" height="74" rx="22"/>
  <text class="bandT" x="240" y="360">V · 의지 지원</text>
  <text class="bandS" x="240" y="386">목표 쪼개기 · 중간 점검 · 방해 요인 예측 · 자기점검</text>
  <text class="bandS" x="680" y="373" text-anchor="middle">시작한 학습을 지속하게 돕는다</text>
</svg>
