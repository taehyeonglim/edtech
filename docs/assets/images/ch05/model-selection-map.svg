<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">수업모형 선택을 위한 세 가지 설계 질문</title>
  <desc id="desc">목표 수행, 학습자 준비도, 평가 증거의 세 질문을 거쳐 문제와 탐구, 자기주도와 자기조절, 맥락과 도제 및 사례 접근을 고르는 도식</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B66C9"/></marker></defs>
  <rect width="960" height="470" rx="24" fill="#fff"/>
  <text x="56" y="64" fill="#0B2C5C" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="30" font-weight="700">모형 이름보다 먼저 묻는 세 가지 설계 질문</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif">
    <g><rect x="56" y="122" width="252" height="110" rx="16" fill="#F4F8FF" stroke="#1B66C9" stroke-width="2"/><text x="82" y="164" fill="#0B2C5C" font-size="22" font-weight="700">1. 목표 수행</text><text x="82" y="198" fill="#46617F" font-size="17">문제 해결·설명·전이?</text></g>
    <g><rect x="354" y="122" width="252" height="110" rx="16" fill="#EAF2FF" stroke="#1B66C9" stroke-width="2"/><text x="380" y="164" fill="#0B2C5C" font-size="22" font-weight="700">2. 학습자 준비도</text><text x="380" y="198" fill="#46617F" font-size="17">어떤 안내가 필요한가?</text></g>
    <g><rect x="652" y="122" width="252" height="110" rx="16" fill="#F4F8FF" stroke="#1B66C9" stroke-width="2"/><text x="678" y="164" fill="#0B2C5C" font-size="22" font-weight="700">3. 평가 증거</text><text x="678" y="198" fill="#46617F" font-size="17">과정·설명·산출물 중 무엇?</text></g>
  </g>
  <path d="M308 177H354M606 177H652" stroke="#1B66C9" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" text-anchor="middle">
    <rect x="73" y="304" width="238" height="78" rx="14" fill="#0B2C5C"/><text x="192" y="338" fill="#fff" font-size="20" font-weight="700">문제·탐구</text><text x="192" y="365" fill="#fff" font-size="15">질문·자료·근거</text>
    <rect x="361" y="304" width="238" height="78" rx="14" fill="#1B66C9"/><text x="480" y="338" fill="#fff" font-size="20" font-weight="700">주도·자기조절</text><text x="480" y="365" fill="#fff" font-size="15">계획·점검·성찰</text>
    <rect x="649" y="304" width="238" height="78" rx="14" fill="#0B2C5C"/><text x="768" y="338" fill="#fff" font-size="20" font-weight="700">맥락·도제·사례</text><text x="768" y="365" fill="#fff" font-size="15">역할·모델링·비교</text>
  </g>
  <path d="M480 232V278" stroke="#1B66C9" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
