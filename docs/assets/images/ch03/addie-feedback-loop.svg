<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">ADDIE의 순환적 설계 흐름</title>
  <desc id="desc">분석, 설계, 개발, 실행, 평가가 순서대로 이어지고 평가 결과가 다시 분석으로 되돌아가는 흐름도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B66C9"/></marker>
  </defs>
  <rect width="960" height="440" rx="24" fill="#fff"/>
  <text x="56" y="66" fill="#0B2C5C" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="30" font-weight="700">ADDIE: 평가 결과를 다음 설계로 되돌리는 순환</text>
  <text x="56" y="101" fill="#46617F" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="18">한 국면을 마치면 다음 판단으로 이어지고, 실행의 증거는 다시 출발 조건을 고친다.</text>
  <path d="M206 229H292M410 229H496M614 229H700" stroke="#1B66C9" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M800 286C780 376 620 390 482 390C270 390 130 350 130 274" fill="none" stroke="#1B66C9" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" text-anchor="middle">
    <g><rect x="58" y="172" width="148" height="114" rx="16" fill="#EAF2FF" stroke="#1B66C9" stroke-width="2"/><text x="132" y="216" fill="#0B2C5C" font-size="26" font-weight="700">분석</text><text x="132" y="250" fill="#46617F" font-size="16">학습자·맥락</text></g>
    <g><rect x="292" y="172" width="148" height="114" rx="16" fill="#EAF2FF" stroke="#1B66C9" stroke-width="2"/><text x="366" y="216" fill="#0B2C5C" font-size="26" font-weight="700">설계</text><text x="366" y="250" fill="#46617F" font-size="16">목표·평가 증거</text></g>
    <g><rect x="496" y="172" width="148" height="114" rx="16" fill="#EAF2FF" stroke="#1B66C9" stroke-width="2"/><text x="570" y="216" fill="#0B2C5C" font-size="26" font-weight="700">개발</text><text x="570" y="250" fill="#46617F" font-size="16">자료·활동</text></g>
    <g><rect x="700" y="172" width="148" height="114" rx="16" fill="#EAF2FF" stroke="#1B66C9" stroke-width="2"/><text x="774" y="216" fill="#0B2C5C" font-size="26" font-weight="700">실행·평가</text><text x="774" y="250" fill="#46617F" font-size="16">관찰·수정 근거</text></g>
  </g>
  <text x="479" y="422" text-anchor="middle" fill="#1B66C9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif" font-size="18" font-weight="600">수업에서 얻은 증거 → 다음 분석과 설계의 입력</text>
</svg>
