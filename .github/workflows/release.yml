name: Release public textbook

on:
  workflow_dispatch:
    inputs:
      evidence_manifest_digest:
        description: 'SHA-256 digest of the private evidence manifest.'
        required: true
        type: string
      evidence_role_aggregate:
        description: 'Coarse count of completed independent review roles.'
        required: true
        type: string

concurrency:
  group: public-textbook-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    outputs:
      receipt_digest: ${{ steps.receipt_digest.outputs.digest }}
      artifact_name: ${{ steps.candidate.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate protected release controls
        env:
          RELEASE_AUDIT_TOKEN: ${{ secrets.RELEASE_AUDIT_TOKEN }}
        run: |
          test -n "$RELEASE_AUDIT_TOKEN"
          python3 tools/validate_release_protection.py \
            --repository "$GITHUB_REPOSITORY" \
            --token "$RELEASE_AUDIT_TOKEN"
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check mkdocs-material
      - name: Install pinned browser audit dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Block releases outside main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Validate supplied non-secret attestation inputs
        env:
          EVIDENCE_MANIFEST_DIGEST: ${{ inputs.evidence_manifest_digest }}
          EVIDENCE_ROLE_AGGREGATE: ${{ inputs.evidence_role_aggregate }}
        run: |
          [[ "$EVIDENCE_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_ROLE_AGGREGATE" =~ ^[1-9][0-9]*$ ]]
      - name: Validate source contracts
        run: |
          python3 tools/validate_textbook_apparatus.py
          python3 tools/validate_textbook_alignment.py
          python3 tools/validate_course_links.py
          python3 tools/validate_freshness.py
          python3 tools/validate_public_boundary.py --root docs
          python3 tools/validate_candidate_routes.py --fixture tests/fixtures/candidate/valid
          python3 tools/validate_release_attestation.py --phase policy
      - name: Check reader before any write
        run: |
          python3 tools/generate_book_reader.py --mode release --check
          python3 tools/validate_reader_foundation.py
      - name: Build one isolated candidate
        run: |
          rm -rf .candidate
          mkdir -p .candidate/site
          python3 tools/generate_book_reader.py --mode release --write --output-dir .candidate/book-reader
          mkdocs build --strict --site-dir .candidate/mkdocs
          cp index.html .candidate/site/index.html
          touch .candidate/site/.nojekyll
          cp -r chapters .candidate/site/chapters
          npm run export:slides -- --manifest quality/textbook-contract.yml --root .candidate/slide-pdfs --provenance .candidate/slide-provenance.json
          npm run validate:slides -- --manifest quality/textbook-contract.yml --root .candidate/slide-pdfs --provenance .candidate/slide-provenance.json
          for number in $(seq -w 1 10); do
            cp ".candidate/slide-pdfs/lecture-${number}.pdf" ".candidate/site/chapters/chapter-${number}/slides/deck.pdf"
          done
          cp -r .candidate/mkdocs .candidate/site/book
          cp book/index.html .candidate/site/book/index.html
          mkdir -p .candidate/site/book/text
          cp -r book/text/. .candidate/site/book/text/
          cp -r .candidate/book-reader .candidate/site/book-reader
          cp -r assets .candidate/site/assets
          tar -C .candidate/site --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - . | sha256sum | awk '{print "sha256:" $1}' > .candidate/candidate.digest
      - name: Audit the exact candidate to be uploaded
        run: |
          python3 tools/validate_public_boundary.py --root .candidate/site
          python3 tools/validate_accessibility_static.py --root .candidate/site
          python3 -m http.server 4173 --directory .candidate/site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python3 tools/validate_candidate_routes.py --base-url http://127.0.0.1:4173 --manifest quality/route-manifest.json
          npm run audit:a11y -- --base-url http://127.0.0.1:4173 --manifest quality/route-manifest.json
          test -s .candidate/candidate.digest
      - name: Create pre-upload binding without private evidence
        env:
          EVIDENCE_MANIFEST_DIGEST: ${{ inputs.evidence_manifest_digest }}
          EVIDENCE_ROLE_AGGREGATE: ${{ inputs.evidence_role_aggregate }}
        run: |
          git archive --format=tar "$GITHUB_SHA" | sha256sum | awk '{print "sha256:" $1}' > .candidate/source.digest
          sha256sum quality/release-attestation.yml | awk '{print "sha256:" $1}' > .candidate/policy.digest
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          binding = {
              'source_digest': Path('.candidate/source.digest').read_text().strip(),
              'evidence_manifest_digest': os.environ['EVIDENCE_MANIFEST_DIGEST'],
              'evidence_role_aggregate': os.environ['EVIDENCE_ROLE_AGGREGATE'],
              'candidate_digest': Path('.candidate/candidate.digest').read_text().strip(),
              'policy_digest': Path('.candidate/policy.digest').read_text().strip(),
              'run_id': run_id, 'run_attempt': attempt,
              'expected_artifact_name': f'github-pages-{run_id}-{attempt}',
          }
          Path('.candidate/release-binding.json').write_text(json.dumps(binding, sort_keys=True), encoding='utf-8')
          PY
          python3 tools/validate_release_attestation.py --phase pre-upload --binding .candidate/release-binding.json
      - name: Set run-unique Pages artifact name
        id: candidate
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the audited candidate exactly once
        id: upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: .candidate/site
      - name: Verify returned candidate receipt against the current run
        id: receipt
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BINDING: .candidate/release-binding.json
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('upload-pages-artifact did not return an artifact ID');
            const { data: artifact } = await github.rest.actions.getArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifactId });
            const { data: runArtifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100 });
            const binding = JSON.parse(fs.readFileSync(process.env.BINDING, 'utf8'));
            const matches = runArtifacts.artifacts.filter((item) => item.name === binding.expected_artifact_name);
            if (matches.length !== 1 || artifact.id !== artifactId || artifact.name !== binding.expected_artifact_name || artifact.workflow_run?.id !== context.runId || artifact.expired || !/^sha256:[0-9a-f]{64}$/.test(artifact.digest ?? '')) throw new Error('Artifact API receipt does not exactly match this unique release candidate');
            binding.returned_artifact_id = String(artifact.id);
            binding.platform_artifact_digest = artifact.digest;
            binding.artifact_api_metadata = { id: String(artifact.id), name: artifact.name, run_id: String(context.runId), run_attempt: process.env.RUN_ATTEMPT, expired: artifact.expired, digest: artifact.digest };
            fs.writeFileSync('.candidate/release-receipt.json', JSON.stringify(binding));
      - name: Validate post-upload receipt
        run: python3 tools/validate_release_attestation.py --phase post-upload --binding .candidate/release-receipt.json
      - name: Upload verified binding and receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/release-receipt.json
          if-no-files-found: error
          overwrite: false
      - name: Bind receipt digest for protected deploy
        id: receipt_digest
        run: echo "digest=sha256:$(sha256sum .candidate/release-receipt.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-receipt
      - name: Revalidate the protected receipt
        run: |
          test "$(find .release-receipt -type f | wc -l | tr -d ' ')" = 1
          test "sha256:$(sha256sum .release-receipt/release-receipt.json | awk '{print $1}')" = "${{ needs.build.outputs.receipt_digest }}"
          python3 tools/validate_release_attestation.py --phase post-upload --binding .release-receipt/release-receipt.json
          test "$(python3 -c 'import json; print(json.load(open(".release-receipt/release-receipt.json"))["expected_artifact_name"])')" = "${{ needs.build.outputs.artifact_name }}"
      - name: Deploy only the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
