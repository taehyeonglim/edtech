name: Freshness review

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Reference date (YYYY-MM-DD); defaults to the run date.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'
      - name: Validate textbook freshness
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          if [ -n "$AS_OF" ]; then
            python3 tools/validate_freshness.py --as-of "$AS_OF"
          else
            python3 tools/validate_freshness.py
          fi
